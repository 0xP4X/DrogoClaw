name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Vet
      run: go vet ./...

    - name: Build
      run: go build -v ./cmd/drogonclaw/

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./internal/...

    - name: Run CTF benchmark
      run: go test -bench=BenchmarkCTFCategories -benchtime=1s -run=^$ ./internal/ctf/

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        files: coverage.out
      continue-on-error: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...
      continue-on-error: true

  release:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:')

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
        cache: true

    - name: Build Linux binary
      run: |
        CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
        go build -ldflags="-s -w" -o bin/drogonclaw-linux-amd64 ./cmd/drogonclaw/
        chmod +x bin/drogonclaw-linux-amd64

    - name: List built binaries
      run: ls -lh bin/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "DrogonClaw Latest"
        body: |
          ## DrogonClaw — Latest Release

          ### Installation
          ```bash
          git clone https://github.com/0xP4X/drogonclaw.git
          cd drogonclaw
          go mod tidy
          go build -o drogonclaw ./cmd/drogonclaw/
          sudo mv drogonclaw /usr/local/bin/
          ```

          ### Manual Download
          Download `drogonclaw-linux-amd64` below and run:
          ```bash
          chmod +x drogonclaw-linux-amd64
          sudo mv drogonclaw-linux-amd64 /usr/local/bin/drogonclaw
          drogonclaw setup
          ```
        files: bin/drogonclaw-linux-amd64
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: docker build -t drogonclaw:latest .
