run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - gosimple
    - unused
    - gosec
    - misspell
    - unconvert
    - goconst
    - gocyclo
    - gocritic
  disable-all: true

linters-settings:
  gocyclo:
    min-complexity: 15
  gosec:
    excludes:
      - G104 # Audit errors not checked
      - G204 # Subprocess launched with variable (necessary for agent payload execution)
      - G304 # File path provided as taint input

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - gocritic
